{% extends "base/layout.html" %}
{% load form_helpers %}

{% block title %}FortiSwitch Port Configuration{% endblock %}

{% block content %}

<form method="post">
    {% csrf_token %}

    <div class="card">

        <div class="card-header d-flex justify-content-between align-items-center">
            <strong>FortiSwitch Port Configuration</strong>
        </div>

        <div class="card-body">

            {{ form|render_form }}

        </div>

        <div class="card-footer text-end">

            <a href="{% url 'plugins:nbtools:fortiswitch_port_configuration_list' %}        Cancel
            </a>

            <button type="submit" class="btn btn-primary">
                Save
            </button>

        </div>

    </div>

</form>

{% endblock %}
